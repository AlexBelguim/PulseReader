name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sync-server/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix sync-server ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pulsereader:ci .

      - name: Smoke test
        run: |
          docker run -d --name pr -p 3000:3000 -e ADMIN_PASSWORD=ci-password pulsereader:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          curl -sf http://localhost:3000/ | grep -q '<title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/books)" = 401
          docker logs pr
